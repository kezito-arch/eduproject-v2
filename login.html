
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | EduProject V2</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .login {
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px #0004;
    }

    .login h1 {
      text-align: center;
      color: #a78bfa;
    }

    .login label {
      display: block;
      margin-top: 16px;
    }

    .login input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: white;
    }

    .login button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .login a {
      color: #c4b5fd;
    }

    #mensaje {
      overflow-wrap: anywhere;
    }

    .centrado {
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="login">
    <h1>EduProject V2</h1>
    <p class="centrado">Inicia sesión en tu cuenta</p>

    <form id="formLogin">
      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Iniciar sesión</button>
    </form>

    <p id="mensaje" role="status"></p>

    <p class="centrado">
      ¿No tienes cuenta?
      <a href="registro.html">Regístrate aquí</a>
    </p>

    <p class="centrado">
      <a href="index.html">Volver al inicio</a>
    </p>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
